# ─────────────────────────────────────────────────────────────────────────────
# ContractAI Guardian — Production Overrides
# Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
services:

  db:
    profiles:
      - self-hosted-db

  backend:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_URL: ${REDIS_URL}
      ENVIRONMENT: production
      LOG_LEVEL: warning
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  frontend:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
