services:
  # Backend API
  - type: web
    name: contractai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contractai-db
          property: connectionURI
      - key: REDIS_URL
        fromService:
          name: contractai-redis
          type: redis
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: CHROMA_PERSIST_DIR
        value: /app/data/vectorstore

  # Redis
  - type: redis
    name: contractai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: contractai-db
    plan: free
    databaseName: contractai
    user: contractai
    region: oregon
