services:
  # Backend API
  - type: web
    name: contractai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contractai-db
          property: connectionURI
      - key: REDIS_URL
        fromService:
          name: contractai-redis
          type: redis
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: S3_BUCKET
        value: contractai-documents
      - key: S3_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CHROMA_PERSIST_DIR
        value: /app/data/vectorstore

  # Redis
  - type: redis
    name: contractai-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: contractai-db
    plan: starter
    databaseName: contractai
    user: contractai
    region: oregon
